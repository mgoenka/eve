substitutions:
  _REGION: us-west1
  _REPOSITORY: cloud-run-images

steps:
  # Reuse layers from the last image when they still match (faster, cheaper builds).
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/eve:latest || exit 0']
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/eve:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/eve:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/eve:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/eve:$BUILD_ID']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/eve:latest']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eve'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/eve:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--execution-environment'
      - 'gen2'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      # Image generation happens in the Gemini API, not here: the server only
      # relays base64 results and keeps small bounded caches (~110 MB max),
      # so 512Mi / 1 vCPU is plenty. CPU boost speeds up cold starts.
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--cpu-boost'
      - '--max-instances'
      - '3'
      - '--concurrency=300'
      - '--timeout'
      - '600'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'

options:
  logging: CLOUD_LOGGING_ONLY
