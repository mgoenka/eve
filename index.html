<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Eve · Yours, quietly</title>
    <meta name="description" content="Eve plans your evening end-to-end. Dinner, dessert, the walk, the spot afterward — generated as one fluid multimodal experience. Built on Gemini." />
    <link rel="canonical" href="https://eve.mohitgoenka.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eve" />
    <meta property="og:url" content="https://eve.mohitgoenka.com/" />
    <meta property="og:title" content="Eve — Plan your evening" />
    <meta property="og:description" content="Your evening, curated end-to-end. Dinner, dessert, the walk and the spot afterward, planned by Eve." />
    <meta property="og:image" content="https://eve.mohitgoenka.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Eve — Yours, quietly. An AI evening concierge." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eve — Plan your evening" />
    <meta name="twitter:description" content="Your evening, curated end-to-end. Dinner, dessert, the walk and the spot afterward, planned by Eve." />
    <meta name="twitter:image" content="https://eve.mohitgoenka.com/og.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eve" />
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
      }
      /* Body font, colours, safe-area padding, tap highlight and focus ring come from ui-kit/theme.css. */
      .font-header, .font-anton {
        font-family: 'Syne', 'DM Sans', sans-serif;
      }
      /*
       * Cormorant Garamond is reserved for Eve's spoken italic flourishes
       * (the breathy whisper lines). Headers and the rest of the app use
       * Syne / DM Sans so it sits side-by-side with Recipe and Buzzer.
       */
      .font-serif {
        font-family: 'Cormorant Garamond Variable', 'Cormorant Garamond', Georgia, serif;
      }
      .site-bg::before, .site-theme::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 100% 80% at 50% -10%, rgba(245, 197, 66, 0.10) 0%, transparent 50%),
          radial-gradient(ellipse 60% 40% at 80% 80%, rgba(232, 163, 158, 0.06) 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 20% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 55%);
        pointer-events: none;
        z-index: 0;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(28px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 24px rgba(245, 197, 66, 0.22); }
        50% { box-shadow: 0 0 40px rgba(245, 197, 66, 0.42); }
      }
      .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
      .animate-fade-in-up { animation: fade-in-up 0.6s ease-out forwards; }
      .animate-glow-pulse { animation: glow-pulse 2.4s ease-in-out infinite; }
      .text-shimmer {
        background: linear-gradient(90deg, #f5c542 0%, #fef3c7 35%, #e8a39e 65%, #f5c542 100%);
        background-size: 200% 100%;
        animation: shimmer 6s linear infinite;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
